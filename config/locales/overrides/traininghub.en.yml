  about:
    registry: >
      The Training Hub was established in 2023 to support, consolidate, and enable access to the SciLifeLab 
      infrastructure’s knowledge, skills and expertise. 
    history: >
      We are building a portal where the Swedish life science community can find opportunities to gain 
      relevant skills, and experts can find support in creating training that captures their knowledge.
      To learn more about what we are planning, find our 2023-2028 Roadmap here.

    events: >
      Events in TeSS are defined as face-to-face or online training opportunities that have set start and end times.
      These primarily take the form of workshops, courses, webinars, etc.; but TeSS also collects information about
      conferences, meetings and hackathons, as these may also provide opportunities for learning.
    nominatim: "<a href='https://wiki.openstreetmap.org/wiki/Nominatim' target='_blank' rel='noopener'>Nominatim</a>"
    materials: >
      Materials in TeSS are defined as training resources that can be accessed at any time. These may be in
      a variety of different formats, including online tutorials, videos, PowerPoint presentations, and so on.
    workflows: >
      New to TeSS are graphical training tools termed 'Training Workflows'.
      Three main types of workflow are in development: Educational Resources, Learning Pathways and Concept Maps.
      These encapsulate different types of, and/or approaches to, training, at different levels of granularity,
      within easy-to-use visual displays.
    learning_paths: >
      In order to advance their skills, trainees need to embark on a path, or developmental trajectory.
      To facilitate this journey, learning paths aim to structure, within simple visual workflows, the set of
      relevant training resources that trainees need to study in order to accomplish their learning objectives.
      Learning paths are being developed by ELIXIR TeSS, ELIXIR-NL and ELIXIR UK.
    resources: >
      In this type of workflow, trainees are introduced to various practical tasks, linked to associated
      online tools and/or databases, within self-contained modules. Each module includes
      i) succinct statements of teaching goals and learning outcomes, to convey to trainees what they will be able to do
      on completion of the module;
      ii) a series of questions or ‘Reflections’ to provoke critical thinking about the tasks that have been completed;
      iii) additional background information and further reading to help support learning and enquiry; and
      iv) multiple choice quiz questions to evaluate understanding at the end.
      Educational Resources for introductory sequence and structural bioinformatics are currently being developed by
      ELIXIR TeSS, ELIXIR-UK and the UK Structural Bioinformatics group (via the FunPDBe project).
    subscribe: >
      TeSS also provides a subscription feature to help users to stay informed about courses, workshops and
      conferences of interest to them. The service may be customised by selecting the relevant filters, and
      initiated via the subscribe button. Users may choose to receive email notifications about upcoming
      events, or have them automatically added to their preferred calendar application.
    subscription_manager: >
      The <a href='%{subscriptions_path}'>subscriptions manager</a> page may be used to change the frequency of, or to remove, subscriptions.
    widgets_and_api: >
      To access TeSS data, organisations may readily import information about relevant events and materials to their site using widgets,
      or may create custom feeds using our API.
    collect_events: >
      %{site_name} collects event information from %{count} content providers, supplementing the data with geolocation information found using %{nominatim}.
    discover_events: Discover Events
    collect_materials: "%{site_name} collects materials from %{count} content providers."
    discover_materials: Discover Materials
  developer:
    license: >
      TeSS is committed to the FAIR principles: making data findable, accessible, interoperable and re-usable.
      As such, all content in TeSS is available under the CC BY 4.0 licence, and can be accessed through our API
      and widgets. The TeSS codebase is also available to re-use under the BSD Licence, and can be found on GitHub.
    code_license: >
      <a href="https://github.com/ElixirTeSS/TeSS/blob/master/LICENSE", target="_blank">BSD 3-Clause<i class="icon icon-md arrow-top-right-icon"></i></a>
    data_license: >
      <a href="https://creativecommons.org/licenses/by/4.0/", target="_blank">CC-BY 4.0<i class="icon icon-md arrow-top-right-icon"></i></a>
    gmaps_countries: >
