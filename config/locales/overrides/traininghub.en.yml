  our_resources:
    landing:
      title: What stage are you at?
      intro: >
        No matter if you’re designing a new course from scratch, are structuring a research school program,
        or have finished the 6th iteration of your workshop, we have resources to support effective
        knowledge transfer at SciLifeLab.
      consultation:
        title: Book a consultation or apply for support
        paragraphs:
          introduction: >
            Have specific questions? Want to pick the brain of someone with experience in SciLifeLab Training?
            Book a consultation with one of our Scientific Training Officers to discuss your project and how we
            can assist you.
          support: >
            The SciLifeLab Training Hub also offers support contracts, where a member of our team can assist you
            in developing, delivering, and/or evaluating your training. To begin the process of applying for
            support, please book a support consult where we can discuss our support framework further.
        booking:
          loading: Loading available appointments…
          external: Open booking page on Cal.com
          failure: The booking calendar could not be loaded. Please use the direct booking link instead.
      lifecycle:
        label: Training lifecycle resource stages
        stages:
          plan_design:
            timeframe: 6-12 MONTHS PRIOR
            description: >
              Define learning outcomes, structure learning experiences, and get input from teaching &
              learning frameworks to create effective training.
          develop:
            timeframe: 1-4 MONTHS PRIOR
            description: >
              Set up a course or workshop website, announce your training, and set up your material so that
              it is ready for delivery.
          deliver:
            timeframe: THE TRAINING!
            description: >
              Generate participant certificates and see if your training is effective by getting feedback from
              your participants.
          evaluate_archive:
            timeframe: 1-6 MONTHS AFTER
            description: >
              Integrate feedback from participants to improve future iterations, and archive your materials so
              that they are Open and FAIR.
