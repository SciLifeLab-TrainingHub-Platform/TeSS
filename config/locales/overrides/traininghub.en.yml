      nonprofit:
        title: "Non-profit and free to use"
        description: "No costs associated, and funded through national and EU funds"
      sustainable:
        title: "Sustainable"
        description: "Open-source code that is here to stay"
      community:
        title: "By life sciences professionals, for a life sciences workforce"
        description: "Built by an international community of life sciences professionals"
      domain:
        title: "Life sciences focused"
        description: "For the entire life sciences workforce"
    faq:
      title: Frequently asked questions
      who:
        q: Who can register content in TeSS?
        a: >
          <p>We welcome any training content relevant to people working in the life sciences and adjacent fields.</p>
      how:
        q: How do I register content in TeSS?
        a: >
          <p>You can register content in TeSS automatically or manually.</p>
          <p>To add content manually, you will need to log in and fill in the registration form for either materials or events.</p>
          <p>TeSS can also automatically register content from an external website, or other source on the web.</p>
          <p><a href='about/registering'>See here for more information.</a></p>
      why:
        q: Why register content in TeSS?
        a: >
          <p>Registering training events and materials in TeSS makes them more findable in a variety ways to various user bases.</p>

          <p>Training in TeSS can be discovered...</p>
          <ul>
            <li><strong>in TeSS</strong>, by visitors browsing TeSS or subscribing to notifications.</li>
            <li><strong>in search engine results</strong>, owing to our search-engine optimisation.</li>
            <li><strong>through other websites</strong> that display TeSS content either using our embeddable widgets or our public API.</li>
          </ul>
      embed:
        q: Can I display TeSS content on my organisation's website?
        a: >
          <p>Yes, a selection of embeddable widgets are available to display training events and materials from TeSS in a variety of formats.</p>
          <p><a href='https://elixirtess.github.io/TeSS_widgets/' target='_blank'>Click here to see examples of widgets and how to use them.</a></p>
      subscribe:
        q: Can I subscribe to updates?
        a: >
          <p>TeSS provides a customizable subscription service, letting you choose exactly what types of training you want to be notified about.</p>
          <p>Choose how you would like receive updates:</p>
          <ul>
            <li><strong>Email</strong> - Daily, weekly or monthly emails containing a digest of new events or materials.</li>
            <li><strong>Calendar</strong> - See new events directly to your online calendar.</li>
            <li><strong>RSS feed</strong> - View new events in an RSS reader.</li>
          </ul>
  privacy:
    information: |
      SciLifeLab operates the SciLifeLab Training Portal at training.scilifelab.se, which provides the <b>Service</b>.<br><br>
      This page is used to inform website visitors regarding our personal data processing policy. If you choose to use our <b>Service</b>, then your personal data will be processed in accordance with this policy.<br><br>
      The personal information that we collect is used for providing and improving the <b>Service</b>. We will not use or share your information with anyone except as described in this policy. All collected personal information will be processed for research purposes, i.e. using the lawful basis of public interest and in accordance with Regulation (EU) 2016/679 of the European Parliament and of the Council of 27 April 2016, the General Data Protection Regulation.
    registration: |
      <p>When you register with the <b>Service</b> we ask for a username, password and email address.</p>
      <ul>
      <li>Your username is used for authentication and attribution. This information is publicly visible, e.g. when a user views a resource you have created.</li>
      <li>Your password is stored as a cryptographically-secure hash and is not publicly visible.</li>
      <li>Your email address is used to confirm your identity and for use when requesting your password to be reset. This email address is not publicly visible, but you may specify an additional public email address (see below).</li>
      </ul>
    personal: |
      You may additionally provide a profile, containing your name, a public email address, website link and avatar. This information is publicly available to all users.<br><br>
      The following parties will have access to processing the personal data provided through the website: SciLifeLab Data Centre, Uppsala University, Kungliga Tekniska högskolan (KTH), Stockholm University, Umeå University. 
    resources: "The details of any training materials and events that you register will be publicly visible and searchable. Any workflows and packages created can be opted to be made private, in which case only you, any collaborators you specify, and the <b>Service</b> administrators will be able to view and search for them."
    server: "When you browse the <b>Service</b>, the server automatically records logs of which pages you access, when you accessed them, and your IP address. These logs are used to fix errors and are not shared with any third parties. Sensitive information (such as passwords) is automatically stripped out."
    cookies: The <b>Service</b> makes use of "strictly necessary cookies" for the site to function. These cookies are needed to establish your "session" with the <b>Service</b>, which allows functionality such as user log-in, and secures against Cross Site Request Forgery (CSRF) attacks.
    analytics: "The portal uses Matomo analytics to track how users are discovering the portal and interacting with the <b>Service</b>. The information gathered includes which pages you visited, which search terms lead you to the <b>Service</b> and information about your web browser. This data is stored on our own servers and is not shared with third parties."
    retention: "Your information will be retained by the <b>Service</b> until you choose to remove it, you delete your account, the <b>Service</b> ceases to exist, or when stipulated by the archival rules for the university as a government authority. If you want to update or remove your personal data, please contact SciLifeLab Training Hub at Stockholm University using traininghub@scilifelab.se."
    code: ""
    controller: ""
    post: ""
    sites: "Our <b>Service</b> may contain links to other sites. If you click on a third-party link, you will be directed to that site. Note that these external sites are not operated by us. Therefore, we strongly advise you to review the privacy policy of these websites. We have no control over, and assume no responsibility for, the content, privacy policies, or practices of any third-party sites or services."
    changes: "We may update our privacy policy from time to time. Thus, we advise you to review this page periodically for any changes. We will notify you of any changes by posting the new privacy policy on this page. These changes posted on this page are effective immediately."
