name: Build and Push Postgres-Curl Image to GHCR

on:
  workflow_dispatch:  # Allows manual trigger from any branch


jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # Needed to push to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image from pgbackup folder
        uses: docker/build-push-action@v5
        with:
          context: ./pg-backup
          file: ./pg-backup/Dockerfile
          push: true
          tags: |
            ghcr.io/scilifelab-traininghub-platform/pgbackup-curl:latest
            ghcr.io/scilifelab-traininghub-platform/pgbackup-curl:${{ github.ref_name }}-run-${{ github.run_number }}
