name: Build and Deploy

on:
  pull_request:
    # TEMPORARY: epic/* is only for the Rails 8 upgrade (epic/rails-8-upgrade). Remove it once that epic is merged.
    branches: [ "rc-*", "epic/*" ]
    types: [opened, synchronize, reopened ]
  push:
    branches:
      - rc-*
    tags:
      - 'rc-v*'
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        type: choice
        options:
          - dev
          - preprod
          - prod
        required: true
      tags:
        description: 'Test scenario tags'
        required: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-app
  NAMESPACE: scilifelab-traininghub-platform

jobs:
  test:
    name: Run Tests
    uses: ./.github/workflows/test.yml

  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml

  build:
    name: Build and Deploy
    needs: [test, lint]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup
      run: | 
        cp env.sample .env
        cp config/secrets.example.yml config/secrets.yml

    - name: Determine the environment
      id: determine-env
      # Ref names are passed via env, not ${{ }} in the script, so a crafted name can't inject shell code
      env:
        REF_NAME: ${{ github.ref_name }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
        INPUT_ENVIRONMENT: ${{ github.event.inputs.environment }}
      run: |
        # Docker tags allow only [A-Za-z0-9_.-], up to 128 chars, and can't start with . or -
        docker_tag() { printf '%s' "$1" | tr -c 'A-Za-z0-9_.-' '-' | sed 's/^[.-]*//' | cut -c1-100; }
        CURRENT_DATE=$(date +%Y-%m-%d-%H-%M-%S)
        BRANCH_NAME=$(docker_tag "$REF_NAME")
        # A manual prod run has no release, so tag it with the ref it was run from (e.g. the v1.7.0 tag)
        RELEASE_TAG=$(docker_tag "${RELEASE_TAG:-$REF_NAME}")
        # Define the environment configuration JSON directly in a variable
        ENV_CONFIG='{
          "dev": {
            "VARIABLE_VALUE": "${{ secrets.DEV_BASE_URL }}",
            "SENDER_EMAIL": "${{ secrets.DEV_SENDER_EMAIL }}",
            "DELIVERY_METHOD": "${{ secrets.DEV_DELIVERY_METHOD }}",
            "DOCKER_TARGET": "development",
            "IMAGE_TAG": "'"$CURRENT_DATE-$BRANCH_NAME"'"
          },
          "preprod": {
            "VARIABLE_VALUE": "${{ secrets.PREPROD_BASE_URL }}",
            "SENDER_EMAIL": "${{ secrets.PREPROD_SENDER_EMAIL }}",
            "DELIVERY_METHOD": "${{ secrets.PREPROD_DELIVERY_METHOD }}",
            "DOCKER_TARGET": "production",
            "IMAGE_TAG": "'"$BRANCH_NAME"'"
          },
          "prod": {
            "VARIABLE_VALUE": "${{ secrets.PROD_BASE_URL }}",
            "SENDER_EMAIL": "${{ secrets.PROD_SENDER_EMAIL }}",
            "DELIVERY_METHOD": "${{ secrets.PROD_DELIVERY_METHOD }}",
            "DOCKER_TARGET": "production",
            "IMAGE_TAG": "'"$RELEASE_TAG"'"
          }
        }'

        # Determine the environment based on the event
        ENVIRONMENT="dev"  # Default to dev
        if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
          ENVIRONMENT="$INPUT_ENVIRONMENT"
        elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/heads/rc-* ]]; then
          ENVIRONMENT="dev"
        elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/rc-v* ]]; then
          ENVIRONMENT="preprod"
        elif [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
          ENVIRONMENT="prod"
        fi

        # Use jq to extract the required values
        VARIABLE_VALUE=$(echo $ENV_CONFIG | jq -r --arg env "$ENVIRONMENT" '.[$env].VARIABLE_VALUE')
        SENDER_EMAIL=$(echo $ENV_CONFIG | jq -r --arg env "$ENVIRONMENT" '.[$env].SENDER_EMAIL')
        DELIVERY_METHOD=$(echo $ENV_CONFIG | jq -r --arg env "$ENVIRONMENT" '.[$env].DELIVERY_METHOD')
        DOCKER_TARGET=$(echo $ENV_CONFIG | jq -r --arg env "$ENVIRONMENT" '.[$env].DOCKER_TARGET')
        IMAGE_TAG=$(echo $ENV_CONFIG | jq -r --arg env "$ENVIRONMENT" '.[$env].IMAGE_TAG')

        # Set environment variables
        echo "ENVIRONMENT=$ENVIRONMENT" >> $GITHUB_ENV
        echo "VARIABLE_VALUE=$VARIABLE_VALUE" >> $GITHUB_ENV
        echo "SENDER_EMAIL=$SENDER_EMAIL" >> $GITHUB_ENV
        echo "DELIVERY_METHOD=$DELIVERY_METHOD" >> $GITHUB_ENV
        echo "DOCKER_TARGET=$DOCKER_TARGET" >> $GITHUB_ENV
        echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

    - name: Change env values in config/tess.yml
      run: |
        sed -i 's|base_url: .*|base_url: '${{ env.VARIABLE_VALUE }}'|' config/tess.yml
        sed -i 's|sender_email: .*|sender_email: '${{ env.SENDER_EMAIL }}'|' config/tess.yml
        sed -i 's|delivery_method: .*|delivery_method: '${{ env.DELIVERY_METHOD }}'|' config/tess.yml

    - name: Set lowercase repository name
      id: lowercase-repo
      run: |
        REPO_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        echo "REPO_NAME=$REPO_NAME" >> $GITHUB_ENV

    - name: Log in to the container registry
      uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
      with:
        images: ghcr.io/${{ env.REPO_NAME }}-app-${{ env.ENVIRONMENT }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        file: ./Dockerfile-dev
        target: ${{ env.DOCKER_TARGET }}
        tags: ghcr.io/${{ env.REPO_NAME }}-app-${{ env.ENVIRONMENT }}:${{ env.IMAGE_TAG }}
        labels: ${{ steps.meta.outputs.labels }}
        # type=Registry, not gha as the gha cache is per ref, so new rc-v* tags/releases would never hit it
        cache-from: |
          type=registry,ref=ghcr.io/${{ env.REPO_NAME }}-app-${{ env.ENVIRONMENT }}:buildcache
          type=registry,ref=ghcr.io/${{ env.REPO_NAME }}-app-preprod:buildcache
        cache-to: type=registry,ref=ghcr.io/${{ env.REPO_NAME }}-app-${{ env.ENVIRONMENT }}:buildcache,mode=max
    
    - name: Post to a Slack channel
      id: slack
      if: ${{ !cancelled() }}
      uses: slackapi/slack-github-action@v1.26.0
      with:
        channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
        slack-message: "GitHub build result: ${{ job.status }}\n${{ github.event.pull_request.html_url || github.event.head_commit.url }}"
      env:
        SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
