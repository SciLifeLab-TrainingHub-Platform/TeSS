name: Tests

on:
  # Allow this workflow to be called by other workflows
  workflow_call:
  
  # Manual trigger
  workflow_dispatch:
  
  # Also allow running independently
  push:
    branches: ['rc-*', 'harshita_implement-tests-CI']
  pull_request:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    # Services: PostgreSQL and Redis run in background
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: tess
          POSTGRES_USER: tess
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:6
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    # Environment variables for test execution
    env:
      RAILS_ENV: test
      DB_HOST: localhost
      DB_NAME: tess
      DB_USER: tess
      DB_PASSWORD: password
      SECRET_BASE_KEY: test_key
      REDIS_TEST_URL: redis://localhost:6379/0
      SLACK_COURSE_NOTIFICATION_CHANNELS: '#channel1,#channel2'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true  # Automatically runs bundle install and caches gems
      
      - name: Setup test configuration files
        run: |
          cp test/config/test_tess.yml config/tess.yml
          cp config/secrets.github.yml config/secrets.yml
          cp config/ingestion.example.yml config/ingestion.yml
      
      - name: Setup test database
        run: bundle exec rake db:test:prepare
      
      - name: Run all tests
        run: bundle exec rails test
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
