# .devcontainer/docker-compose.codespaces.yml
#
# Codespaces-only override layered on top of docker-compose-prod.yml.
# Reuses the production stack as-is and only adds:
#   - PR source bind mount (.:/code) on `app` and `sidekiq` so the running
#     containers always reflect the PR branch.
#   - Two read-only overlay mounts for config/tess.yml and config/secrets.yml
#     generated by .devcontainer/pre-build.sh — keeps the tracked
#     config/tess.yml clean and points the mailer at MailHog.
#   - SECRET_KEY_BASE (throwaway, preview-only) so production boot succeeds.
#   - Slack env passthroughs from Codespaces Secrets (empty by default → safe).
#   - A MailHog sidecar that captures all outbound email locally.
#   - Disables the dbbackups service (not useful for a per-PR preview).
#
# This file is referenced by .devcontainer/devcontainer.json via:
#   "dockerComposeFile": ["../docker-compose-prod.yml",
#                         "docker-compose.codespaces.yml"]
# Compose merges the two; this file always wins on conflicts.
#
# IMPORTANT: docker-compose-prod.yml is NOT modified by this work.

services:

  app:
    # Mount the PR workspace + preview-only config overlays. The two .preview.yml
    # files are generated by .devcontainer/pre-build.sh on host before this runs.
    volumes:
      - .:/code
      # tess.preview.yml is mounted RW so post-start.sh can patch the base_url
      # to the actual Codespaces forwarded URL. Changes are reflected on the
      # host file too, but that's fine — pre-build.sh regenerates it on every
      # Codespace start, and the file is gitignored.
      - ./.devcontainer/tess.preview.yml:/code/config/tess.yml
      - ./.devcontainer/secrets.preview.yml:/code/config/secrets.yml:ro
      # Preserve the base volumes from docker-compose-prod.yml so behaviour stays prod-like.
      - uploads:/code/public/system
      - logs:/code/log
    environment:
      # Required for Rails production boot.
      SECRET_KEY_BASE: "preview-codespace-secret-not-for-production"
      # Re-declared for clarity (already true in base).
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      RAILS_SERVE_STATIC_FILES: "true"
      # Make Rails trust the Codespaces port-forwarding proxy as an SSL
      # terminator. Without this, Rails sees scheme=http and the CSRF Origin
      # check rejects POSTs from the browser (Origin: https://...) with 422.
      # Wired in config/initializers/zz_assume_ssl_proxy.rb (the initializer
      # is a strict no-op unless this env var is "true", so real production
      # behind k8s ingress is unaffected).
      RAILS_ASSUME_SSL: "true"
      # Slack passthroughs from GitHub Codespaces Secrets. Empty by default →
      # SlackNotificationJob logs an API error in its rescue block and moves on.
      # See plan-preview-env.md "Manual Setup" TODO-1/TODO-2 to enable real posts.
      SLACK_BOT_USER_OAUTH_TOKEN: ${SLACK_BOT_USER_OAUTH_TOKEN:-}
      SLACK_COURSE_NOTIFICATION_CHANNELS: ${SLACK_COURSE_NOTIFICATION_CHANNELS:-#tess-preview-test}
    depends_on:
      - db
      - solr
      - redis
      - mailhog
    # Override base `restart: always` — easier to debug a preview env.
    restart: "no"
    # Keep stdin/tty open so `docker compose exec app bash` is friendly.
    tty: true
    stdin_open: true

  sidekiq:
    # Sidekiq is the process that actually executes SlackNotificationJob, so it
    # needs the same source mount, overlays, secret, and Slack env vars as app.
    volumes:
      - .:/code
      # See app service for why tess.preview.yml is RW (host-file patching by post-start.sh).
      - ./.devcontainer/tess.preview.yml:/code/config/tess.yml
      - ./.devcontainer/secrets.preview.yml:/code/config/secrets.yml:ro
      - uploads:/code/public/system
    environment:
      SECRET_KEY_BASE: "preview-codespace-secret-not-for-production"
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      SLACK_BOT_USER_OAUTH_TOKEN: ${SLACK_BOT_USER_OAUTH_TOKEN:-}
      SLACK_COURSE_NOTIFICATION_CHANNELS: ${SLACK_COURSE_NOTIFICATION_CHANNELS:-#tess-preview-test}
    depends_on:
      - db
      - redis
      - mailhog
    restart: "no"

  # New service: MailHog captures every outbound email inside the Codespace.
  # SMTP on 1025 (internal only); web UI on 8025 (forwarded by devcontainer.json).
  mailhog:
    image: mailhog/mailhog:latest
    container_name: ${PREFIX}-mailhog
    ports:
      - "8025:8025"   # web UI; SMTP 1025 stays on the internal docker network
    restart: "no"

  # Disable the prod-only DB backup sidecar in previews — wasteful for an
  # ephemeral environment. `profiles` requires explicit activation to start.
  dbbackups:
    profiles:
      - disabled
